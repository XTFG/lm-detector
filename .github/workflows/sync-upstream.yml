name: Sync all upstream branches

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync all upstream branches
        shell: bash
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            https://github.com/Ikaleio/lm-detector.git

          git fetch --no-tags --prune upstream \
            '+refs/heads/*:refs/remotes/upstream/*'

          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'

          main_changed=false
          failed=0

          while IFS= read -r branch; do
            [ "$branch" = "HEAD" ] && continue

            echo "Syncing: $branch"

            src="refs/remotes/upstream/$branch"
            dst="refs/remotes/origin/$branch"

            # Create branches missing from the fork
            if ! git show-ref --verify --quiet "$dst"; then
              if git push origin "$src:refs/heads/$branch"; then
                echo "Created: $branch"
                if [ "$branch" = "main" ]; then
                  main_changed=true
                fi
              else
                echo "::error::Cannot create $branch"
                failed=1
              fi
              continue
            fi

            # Merge upstream changes into existing branches
            git switch -C _sync "$dst"
            before="$(git rev-parse HEAD)"

            if git merge --no-edit "$src"; then
              after="$(git rev-parse HEAD)"

              if [ "$before" != "$after" ]; then
                if git push origin "HEAD:refs/heads/$branch"; then
                  echo "Updated: $branch"
                  if [ "$branch" = "main" ]; then
                    main_changed=true
                  fi
                else
                  echo "::error::Cannot push $branch"
                  failed=1
                fi
              else
                echo "Already up to date: $branch"
              fi
            else
              git merge --abort || true
              echo "::error::Merge conflict: $branch"
              failed=1
            fi

          done < <(
            git for-each-ref \
              --format='%(refname:lstrip=3)' \
              refs/remotes/upstream
          )

          # Rebuild Cloudflare Pages only if main changed
          if [ "$main_changed" = true ] && \
             [ -n "$CF_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$CF_DEPLOY_HOOK"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::Some branches failed to sync"
            exit 1
          fi
